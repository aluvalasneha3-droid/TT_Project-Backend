# Temporary in-memory database for local development. All records disappear when the app stops.
spring.datasource.url=jdbc:h2:mem:candlecraft-local;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${CANDLE_CRAFT_JWT_SECRET:local-dev-secret-change-me-32-bytes}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console