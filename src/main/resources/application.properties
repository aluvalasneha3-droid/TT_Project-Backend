spring.application.name=TT-Backend

server.port=${PORT:8080}

# Packaged applications use MySQL; Maven's spring-boot:run goal selects temporary local H2.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:candle_craft}?serverTimezone=UTC&sslMode=PREFERRED&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Set to a securely generated secret of at least 32 UTF-8 bytes; never commit the value.
jwt.secret=${CANDLE_CRAFT_JWT_SECRET}
jwt.expiration-ms=86400000

# Optional live NSE quotes. Leave unset to use clearly labelled demo prices.
marketdata.upstox.token=${UPSTOX_ANALYTICS_TOKEN:}
marketdata.upstox.instrument-keys=${UPSTOX_INSTRUMENT_KEYS:}
