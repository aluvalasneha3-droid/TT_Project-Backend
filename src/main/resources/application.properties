spring.application.name=TT-Backend

# Temporary local configuration for development before MySQL is approved.
# This keeps the app runnable without touching a real database.
spring.datasource.url=jdbc:h2:mem:candlecraft;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=root
spring.datasource.password=Sneha@_1216
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${CANDLE_CRAFT_JWT_SECRET:local-dev-secret-change-me-32-bytes}
jwt.expiration-ms=86400000

# Optional live NSE quotes. Leave unset to use clearly labelled demo prices.
marketdata.upstox.token=${UPSTOX_ANALYTICS_TOKEN:}
marketdata.upstox.instrument-keys=${UPSTOX_INSTRUMENT_KEYS:}

